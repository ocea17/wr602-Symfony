# Page d'accueil PUBLIQUE (plans)
app_home_public:
  path: /
  controller: App\Controller\HomePublicController::index
  methods: ['GET']

# Dashboard (connecté uniquement)
app_home:
  path: /dashboard
  controller: App\Controller\HomeController::index
  methods: ['GET']

app_login:
  path: /login
  controller: App\Controller\SecurityController::login
  methods: ['GET', 'POST']

app_logout:
  path: /logout
  methods: ['GET']

app_register:
  path: /register
  controller: App\Controller\RegistrationController::register
  methods: ['GET', 'POST']

app_forgot_password:
  path: /forgot-password
  controller: App\Controller\PasswordResetController::forgotPassword
  methods: ['GET', 'POST']

app_reset_password:
  path: /reset-password/{token}
  controller: App\Controller\PasswordResetController::resetPassword
  methods: ['GET', 'POST']

app_subscription_change:
  path: /subscription/change
  controller: App\Controller\SubscriptionController::change
  methods: ['GET', 'POST']

app_pdf_index:
  path: /pdf
  controller: App\Controller\GeneratePdfController::index
  methods: ['GET']

app_convert_tool:
  path: /convert/{slug}
  controller: App\Controller\GeneratePdfController::convertTool
  methods: ['GET', 'POST']

app_history:
  path: /history
  controller: App\Controller\HistoryController::index
  methods: ['GET']

app_history_send:
  path: /history/send/{id}
  controller: App\Controller\HistoryController::send
  methods: POST

app_history_download:
  path: /history/download/{id}
  controller: App\Controller\HistoryController::download
  methods: ['GET']

app_history_delete:
  path: /history/{id}/delete
  controller: App\Controller\HistoryController::delete
  methods: POST

app_profile:
  path: /profile
  controller: App\Controller\ProfileController::index
  methods: ['GET']

app_profile_update_color:
    path: /profile/update-color
    controller: App\Controller\ProfileController::updateColor
    methods: ['POST']

app_profile_update_info:
  path: /profile/update-info
  controller: App\Controller\ProfileController::updateInfo
  methods: ['POST']

app_profile_update_password:
    path: /profile/update-password
    controller: App\Controller\ProfileController::updatePassword
    methods: ['POST']

# Routes Contact
app_contacts_index:
    path: /contacts
    controller: App\Controller\ContactController::index
    methods: GET

app_contacts_new:
    path: /contacts/new
    controller: App\Controller\ContactController::new
    methods: [GET, POST]

app_contacts_edit:
    path: /contacts/{id}/edit
    controller: App\Controller\ContactController::edit
    methods: [GET, POST]

app_contacts_delete:
    path: /contacts/{id}/delete
    controller: App\Controller\ContactController::delete
    methods: POST

# Payment routes
app_payment_checkout:
  path: /payment/checkout/{id}
  controller: App\Controller\PaymentController::checkout
  methods: GET

app_payment_success:
  path: /payment/success
  controller: App\Controller\PaymentController::success
  methods: GET

app_payment_cancel:
  path: /payment/cancel
  controller: App\Controller\PaymentController::cancel
  methods: GET

app_payment_webhook:
  path: /payment/webhook
  controller: App\Controller\WebhookController::webhook
  methods: POST

app_pdf_result:
  path: /pdf/result/{id}
  controller: App\Controller\GeneratePdfController::result
  methods: [ GET ]