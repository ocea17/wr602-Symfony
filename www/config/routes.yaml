controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

app_login:
  path: /login
  controller: App\Controller\SecurityController::login

app_forgot_password:
  path: /forgot-password
  controller: App\Controller\PasswordResetController::forgotPassword
  methods: ['GET', 'POST']

app_reset_password:
  path: /reset-password/{token}
  controller: App\Controller\PasswordResetController::resetPassword
  methods: ['GET', 'POST']

app_register:
  path: /register
  controller: App\Controller\RegistrationController::register
  methods: ['GET', 'POST']

app_home:
  path: /
  controller: App\Controller\HomeController::index

app_subscription_change:
  path: /subscription/change
  controller: App\Controller\SubscriptionController::change
  methods: ['GET', 'POST']

app_pdf_index:
  path: /pdf
  controller: App\Controller\GeneratePdfController::index
  methods: ['GET']

app_pdf_generate_url:
  path: /pdf/generate/url
  controller: App\Controller\GeneratePdfController::generateFromUrl
  methods: ['GET', 'POST']

app_pdf_generate_file:
  path: /pdf/generate/file
  controller: App\Controller\GeneratePdfController::generateFromFile
  methods: ['GET', 'POST']

app_pdf_generate_wysiwyg:
  path: /pdf/generate/wysiwyg
  controller: App\Controller\GeneratePdfController::generateFromWysiwyg
  methods: ['GET', 'POST']

app_history:
  path: /history
  controller: App\Controller\HistoryController::index
  methods: ['GET']

app_history_download:
  path: /history/download/{id}
  controller: App\Controller\HistoryController::download
  methods: ['GET']

app_contact_index:
  path: /contacts
  controller: App\Controller\ContactController::index
  methods: ['GET']

app_contact_add:
  path: /contacts/add
  controller: App\Controller\ContactController::add
  methods: ['GET', 'POST']

app_contact_delete:
  path: /contacts/delete/{id}
  controller: App\Controller\ContactController::delete
  methods: ['GET']